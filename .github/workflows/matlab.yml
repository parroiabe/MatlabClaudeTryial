name: MATLAB

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true
          # Añade aquí los toolboxes que necesites, separados por espacios, p. ej.:
          # products: Signal_Processing_Toolbox Optimization_Toolbox

      - name: Ejecutar tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: src
          select-by-folder: tests
          test-results-junit: test-results/results.xml

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
